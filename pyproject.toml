[project]
name = "gtfs-filtering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1",
]

[project.optional-dependencies]
cli = [
    "click>=8",
]
gui = [
    "python-i18n[yaml]>=0.3",
    "PyQt6>=6",
]
web = [
    "fastapi>=0.115",
    "pydantic-settings>=2",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fsspec>=2026.6.0",
    "httpx2>=2.13.1",
    "pyinstaller>=6",
    "pytest>=8.4.2",
    "ruff>=0",
]
